<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEFE · Pruebas</title>
<!--
  /Pruebas/ YA NO ES UNA COPIA DEL SISTEMA.
  Antes acá vivía un index.html/db.js/realtime.js duplicados que tarde o
  temprano divergían de la raíz (de hecho, quedaron viejos). Ahora esta
  carpeta sólo redirige a la MISMA app de la raíz, apuntada a la base de
  Pruebas con ?env=pruebas. Una sola copia de código para todos.

  El modo pruebas queda fijo toda la sesión: el ruteo es por #hash (no
  toca el ?env) y el logout no recarga, así que ?env=pruebas no se pierde.
-->
<script>
  (function(){
    // Preserva el #hash por si es un enlace de recuperación de contraseña.
    var destino = '/?env=pruebas' + (location.hash || '');
    location.replace(destino);
  })();
</script>
<meta http-equiv="refresh" content="0;url=/?env=pruebas">
<style>
  :root{
    --bg:#f4f6f8; --ink:#16202e; --muted:#5a6675; --accent:#1f4e8c; --line:#dde3ea;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e141c; --ink:#e8edf3; --muted:#93a1b1; --accent:#6ba0e0; --line:#263341; }
  }
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .box{max-width:26rem}
  .badge{
    display:inline-block; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--line); border-radius:999px; padding:5px 12px; margin-bottom:14px;
  }
  h1{font-size:19px; margin:.2em 0 .5em; font-weight:700}
  p{color:var(--muted); font-size:14px; line-height:1.5; margin:.3em 0}
  a{color:var(--accent); font-weight:600; text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="box">
    <span class="badge">Entorno de Pruebas</span>
    <h1>Abriendo SEFE en modo Pruebas…</h1>
    <p>Esta sección ahora usa la misma app del sistema apuntada a la base de pruebas.</p>
    <p><a href="/?env=pruebas">Si no abre solo, tocá aquí</a>.</p>
  </main>
</body>
</html>
